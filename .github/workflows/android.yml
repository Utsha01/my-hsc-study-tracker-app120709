name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - name: Set up Java (Capacitor 7 / AGP 8 need JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install web deps
        run: npm ci

      - name: Install Capacitor
        run: npm i --no-audit --no-fund @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Build the web app
        run: npm run build

      - name: Create Capacitor project
        run: |
          if [ ! -f capacitor.config.ts ] && [ ! -f capacitor.config.json ]; then
            npx cap init "HSC Study Tracker" com.hscpinnacle.tracker --web-dir=dist
          fi

      - name: Add + sync Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Assemble debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Report output
        run: ls -la android/app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
